<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Högsbo Teorifrågor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #F9FAFB;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #16A34A;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  .check svg { width: 32px; height: 32px; }
  h1 {
    font-size: 20px;
    color: #0F1117;
    margin-bottom: 8px;
  }
  p {
    font-size: 14px;
    color: #6B7280;
    line-height: 1.7;
    margin-bottom: 4px;
  }
  .divider {
    height: 1px;
    background: #E5E7EB;
    margin: 20px 0;
  }
  .en, .sv {
    direction: ltr;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 13L9 17L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>ایمیل شما با موفقیت تایید شد ✅</h1>
    <p>حالا می‌تونید برگردید به اپلیکیشن Högsbo Teorifrågor و با ایمیل و رمز عبورتون وارد بشید.</p>
    <div class="divider"></div>
    <p class="sv">Din e-post har bekräftats. Gå tillbaka till appen och logga in.</p>
    <div class="divider"></div>
    <p class="en">Your email has been confirmed. Go back to the app and log in.</p>
  </div>
</body>
</html>
